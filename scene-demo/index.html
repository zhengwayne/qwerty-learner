      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {

        }
      })(window.location)

    <!-- Pre-paint theme init: reads themePreference from localStorage and applies
         html.dark before first paint to avoid flash of wrong theme.
         Requirement 5.4 — applied before app bundle, before shell is visible.
         Falls back to legacy 'isOpenDarkModeAtom' key and then to OS preference. -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('themePreference')
          var pref = raw ? JSON.parse(raw) : null

          // Backward compat: if new key absent, try legacy boolean key
          if (pref === null || pref === undefined) {
            var legacyRaw = localStorage.getItem('isOpenDarkModeAtom')
            if (legacyRaw !== null) {
              try {
                pref = JSON.parse(legacyRaw) === true ? 'dark' : 'light'
              } catch (e) {
                pref = null
              }
            }
          }

          var osDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = pref === 'dark' || ((pref == null || pref === 'system') && osDark)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          // localStorage blocked (e.g. private browsing restrictions) — fall back to OS
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
      })()
    </script>
